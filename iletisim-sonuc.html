<nav class="navbar navbar-expand-lg navbar-dark bg-primary py-2">
  <div class="container-fluid px-4 d-flex align-items-center">
    <img src="images/abdullah.png" alt="Profil" class="rounded-circle me-2" width="45" height="45">
    <a class="navbar-brand fw-bold me-auto" href="index.html">Abdullah'ın Web Sitesi</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Ana Sayfa</a></li>
        <li class="nav-item"><a class="nav-link" href="hakkimda.html">Hakkımda</a></li>

      </ul>
    </div>
  </div>
</nav>

<div class="container mt-4">
  <h2>Gönderilen Bilgiler</h2>
  <ul id="sonuc" class="list-group mt-4"></ul>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const sonuc = document.getElementById("sonuc");

  const keys = ["email", "telefon"];
  keys.forEach((key) => {
    if (params.has(key)) {
      const item = document.createElement("li");
      item.classList.add("list-group-item");
      item.innerText = `${key.toUpperCase()}: ${params.get(key)}`;
      sonuc.appendChild(item);
    }
  });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

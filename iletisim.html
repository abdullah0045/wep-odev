<div id="app" class="container mt-4">
  <h2 class="mb-4">İletişim Formu</h2>
  <form id="iletisimForm">
    <!-- Email -->
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="text" class="form-control" v-model="email">
    </div>

    <!-- Telefon -->
    <div class="mb-3">
      <label class="form-label">Telefon</label>
      <input type="text" class="form-control" v-model="telefon">
    </div>

    <!-- Butonlar -->
    <div class="mb-3">
      <button type="button" class="btn btn-warning me-2" onclick="temizleForm()">Temizle</button>
      <button type="button" class="btn btn-primary me-2" onclick="jsIleDogrula()">JS ile Doğrula</button>
      <button type="button" class="btn btn-success me-2" @click="vueIleDogrula">Vue.js ile Doğrula</button>
      <button type="button" class="btn btn-dark" onclick="formuGonder()">Gönder</button>
    </div>
  </form>
</div>

<!-- ✅ Script -->
<script>
  const app = new Vue({
    el: '#app',
    data: {
      email: '',
      telefon: ''
    },
    methods: {
      vueIleDogrula() {
        let hata = [];
        const emailDogruMu = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(this.email);
        if (!emailDogruMu) hata.push("Email geçersiz.");
        if (!/^\d+$/.test(this.telefon)) hata.push("Telefon sadece rakam olmalı.");
        alert(hata.length ? "Vue.js Hatalar:\n" + hata.join("\n") : "Vue.js doğrulama başarılı!");
      }
    }
  });

  function jsIleDogrula() {
    const email = app.email;
    const telefon = app.telefon;
    let hata = [];
    const emailDogruMu = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    if (!emailDogruMu) hata.push("Email geçersiz.");
    if (!/^\d+$/.test(telefon)) hata.push("Telefon sadece rakam olmalı.");
    alert(hata.length ? "JS Hatalar:\n" + hata.join("\n") : "JS doğrulama başarılı!");
  }

  function temizleForm() {
    document.getElementById("iletisimForm").reset();
    app.email = ''; app.telefon = '';
  }

  function formuGonder() {
    const email = app.email;
    const telefon = app.telefon;
    let hata = [];
    const emailDogruMu = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    if (!emailDogruMu) hata.push("Email geçersiz.");
    if (!/^\d+$/.test(telefon)) hata.push("Telefon sadece rakam olmalı.");
    if (hata.length > 0) {
      alert("Gönderme engellendi:\n" + hata.join("\n"));
      return;
    }

    const veri = {
      email: email,
      telefon: telefon
    };
    const query = new URLSearchParams(veri).toString();
    window.location.href = `iletisim-SONUC.html?${query}`;
  }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
